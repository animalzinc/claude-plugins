<h1>Kite facts</h1>
<p>The <strong>Breeze 2</strong> kite weighs <em>180 grams</em> and flies in winds from 8 to 25 km/h.<sup id="r1"><a href="#fn1">1</a></sup></p>
<h2>Line length</h2>
<ul><li>Beginners use a 30 meter line.</li><li>Experts use up to <a href="https://example.org/lines">60 meters</a>.</li></ul>
<blockquote><p>A kite rises against the wind, not with it.</p></blockquote>
<figure><img src="/kite.png" alt="A red kite over a beach"><figcaption>The Breeze 2 in flight</figcaption></figure>
